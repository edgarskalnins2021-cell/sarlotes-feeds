name: Salidzini XML

on:
  schedule:
    # Katru stundu: UTC 4:17–19:17 = ziemā Rīgā 6:17, 7:17 … 21:17 (vasarā stundu vēlāk).
    # Cenueksperts.lv datus nolasa vismaz reizi stundā.
    # Bieži, jo GitHub plānotos darbus mēdz kavēt vai izlaist; tā fails pirms katras
    # Salidzini nolasīšanas (08–12, 12–13, 15–16, 18–19) ir svaigs. Minūte :17 – ne pilnā stundā.
    - cron: '17 4-19 * * *'
  workflow_dispatch: # ļauj palaist arī ar roku (Actions → Salidzini XML → Run workflow)

permissions:
  contents: write # nedēļas statusa ieraksts (lai GitHub neatslēgtu grafiku pēc 60 dienām bez aktivitātes)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Noteikumu pārbaudes
        run: node test/test-core.mjs > /dev/null && node test/test-ceno.mjs > /dev/null && node test/test-cenueksperts.mjs > /dev/null && node test/test-hindee.mjs > /dev/null && node test/test-kaina24.mjs > /dev/null && node test/test-google.mjs > /dev/null
      - name: Ģenerē XML (salidzini, kurpirkt, ceno, cenueksperts, hindee, kaina24, google-lv)
        env:
          SHOPIFY_STORE: sarlotesaudumi.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node generate.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Nedēļas statuss (pirmdienas rītā)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Europe/Riga date +%u)" = "1" ] && [ "$(TZ=Europe/Riga date +%H)" -lt 10 ]; then
            mkdir -p status && cp public/stats.json status/last-run.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/last-run.json
            git commit -m "Statuss $(TZ=Europe/Riga date +%F)" || echo "Nav izmaiņu"
            git push || echo "Statusu neizdevās ierakstīt – XML tas neietekmē"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Pēc izvietošanas nolasa publiskos failus: HTTP 200, derīgs XML, preču skaits sakrīt ar stats.json.
  # Rezultāts redzams kā piezīmes (annotations) šī darba lapā.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pārbauda publiskos XML
        env:
          BASE: https://edgarskalnins2021-cell.github.io/sarlotes-feeds
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, xml.etree.ElementTree as ET
          base, run = os.environ['BASE'], os.environ['RUN']
          def get(name):
              last = None
              for attempt in range(12):  # Pages izplatīšanās var aizņemt dažas minūtes
                  try:
                      with urllib.request.urlopen(f'{base}/{name}?v={run}-{attempt}', timeout=60) as r:
                          return r.status, r.headers.get('content-type', ''), r.read()
                  except Exception as e:
                      last = e
                      time.sleep(20)
              raise SystemExit(f'::error title={name}::nav pieejams: {last}')
          _, _, s = get('stats.json')
          stats = json.loads(s)
          # fails: (gaidāmais skaits, saknes tags, preces ceļš, cenas tags, saites tags, saites sākums[, cenas formāts])
          lv = 'https://sarlotesaudumi.lv/products/'
          G = '{http://base.google.com/ns/1.0}'
          expect = {'salidzini.xml': (stats['items'], 'root', 'item', 'price', 'link', lv),
                    'kurpirkt.xml': (stats['items'], 'root', 'item', 'price', 'link', lv),
                    'ceno.xml': (stats['ceno']['items'], 'root', 'item', 'price', 'link', lv),
                    'cenueksperts.xml': (stats['cenueksperts']['items'], 'DataFeeds', 'item_data', 'item_price', 'item_page_url', lv)}
          # Igaunija un Lietuva; ja valsts veikals neatbildēja – iepriekšējā versija (vai fails šoreiz nav)
          if stats.get('hindee', {}).get('items'):
              expect['hindee.xml'] = (stats['hindee']['items'], 'products', 'product', 'price', 'product_url', 'https://sharlottekangad.ee/products/')
          if stats.get('kaina24', {}).get('items'):
              expect['kaina24.xml'] = (stats['kaina24']['items'], 'products', 'product', 'price', 'product_url', 'https://sarlotesaudiniai.lt/products/')
          # Google Merchant Center (RSS 2.0, g: lauki, cena "0.39 EUR")
          if stats.get('google', {}).get('items'):
              expect['google-lv.xml'] = (stats['google']['items'], 'rss', 'channel/item', G + 'price', G + 'link', lv, r'\d+\.\d{2} EUR')
          for name, (want, root_tag, item_tag, price_tag, link_tag, prefix, *fmt) in expect.items():
              status, ctype, body = get(name)
              root = ET.fromstring(body)
              items = root.findall(item_tag)
              prices_ok = all(re.fullmatch(fmt[0] if fmt else r'\d+\.\d{2}', i.findtext(price_tag) or '') for i in items)
              links = [i.findtext(link_tag) or '' for i in items]
              ok = (status == 200 and root.tag == root_tag and len(items) == want and prices_ok
                    and all(l.startswith(prefix) for l in links))
              if name == 'google-lv.xml':  # Google: unikāli ID līdz 50 zīmēm, nosaukums līdz 150, apraksts līdz 5000
                  ids = [i.findtext(G + 'id') or '' for i in items]
                  ok = ok and len(set(ids)) == len(ids) and all(0 < len(x) <= 50 for x in ids) \
                      and all(0 < len(i.findtext(G + 'title') or '') <= 150 and 0 < len(i.findtext(G + 'description') or '') <= 5000 for i in items)
              msg = f'HTTP {status}, {ctype}, {len(items)} preces (stats.json: {want}), cenas {"OK" if prices_ok else "KĻŪDA"}, unikālas saites {len(set(links))}'
              print(f'::{"notice" if ok else "error"} title={name}::{msg}')
              if not ok: raise SystemExit(1)
          _, _, html = get('index.html')
          if not all(f'href="{n}"' in html.decode() for n in expect):
              raise SystemExit('::error title=index.html::trūkst saites uz XML failiem')
          for key, title in (('ceno', 'Ceno'), ('cenueksperts', 'Cenueksperts'), ('hindee', 'Hind.ee'), ('kaina24', 'Kaina24'), ('google', 'Google')):
              c = stats.get(key)
              if not c:
                  print(f'::warning title={title}::fails šoreiz netika izveidots'); continue
              extra = f", iepriekšējā versija ({c.get('error', '')})" if c.get('carriedOver') else ''
              print(f"::notice title={title}::{c['items']} preces, metrā {c['decimal']}, izlaistas {json.dumps(c['skipped'], ensure_ascii=False)}{extra}")
          PY
