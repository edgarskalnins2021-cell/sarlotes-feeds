# PAGAIDU izmēģinājums PR zaram (tiks izņemts pirms apvienošanas): uzbūvē google-ads-custom-lv.csv no veikala publiskā
# /products.json, pārbauda katru rindu, 30 attēlus un 30 preču lapas. Nekas netiek publicēts (nav Pages, nav atslēgu).
name: Custom CSV izmēģinājums (bez publicēšanas)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read

concurrency:
  group: custom-izmeginajums-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Testi
        run: for t in test/test-*.mjs; do node "$t" > /dev/null || exit 1; done
      - name: Uzbūvē no publiskā veikala un pārbauda
        run: mkdir -p custom-check && (node check-google-ads-custom.mjs --storefront custom-check | tee custom-check/check.txt || true)
      - name: 30 attēli un 30 preču lapas
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parseCsv } from './feed-core.mjs';
          const rows = parseCsv(readFileSync('custom-check/google-ads-custom-lv.csv', 'utf8')).slice(1);
          const step = Math.max(1, Math.floor(rows.length / 30));
          const sample = rows.filter((_, i) => i % step === 0).slice(0, 30);
          const dims = (b) => {
            if (b[0] === 0x89 && b[1] === 0x50) return [b.readUInt32BE(16), b.readUInt32BE(20), 'PNG'];
            if (b[0] === 0x47 && b[1] === 0x49) return [b.readUInt16LE(6), b.readUInt16LE(8), 'GIF'];
            if (b[0] === 0xff && b[1] === 0xd8) {
              for (let i = 2; i + 9 < b.length;) {
                if (b[i] !== 0xff) break;
                const m = b[i + 1];
                if (m >= 0xc0 && m <= 0xcf && ![0xc4, 0xc8, 0xcc].includes(m)) return [b.readUInt16BE(i + 7), b.readUInt16BE(i + 5), 'JPEG'];
                i += 2 + b.readUInt16BE(i + 2);
              }
              return [0, 0, 'JPEG?'];
            }
            if (b.slice(8, 12).toString() === 'WEBP') return [0, 0, 'WEBP'];
            return [0, 0, 'cits'];
          };
          const out = [];
          let bad = 0;
          for (const r of sample) {
            const img = await fetch(r[6], { headers: { Accept: 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8', 'User-Agent': 'Googlebot-Image/1.0' } });
            const buf = Buffer.from(await img.arrayBuffer());
            const [w, h, kind] = dims(buf);
            const page = await fetch(r[5], { redirect: 'manual', headers: { 'User-Agent': 'Mozilla/5.0 (compatible; Storebot-Google/1.0)' } });
            const ok = img.status === 200 && ['JPEG', 'PNG', 'GIF'].includes(kind) && w * h > 0 && w * h <= 6e6 && buf.length <= 11.4e6 && page.status === 200;
            if (!ok) bad++;
            out.push([ok ? 'OK' : 'KĻŪDA', r[0], `attēls ${img.status} ${img.headers.get('content-type')} ${kind} ${w}x${h} ${(buf.length / 1024).toFixed(0)} KB`, `lapa ${page.status}`].join(' | '));
          }
          out.push(`Paraugs: ${sample.length}, kļūdas: ${bad}`);
          writeFileSync('custom-check/paraugs-30.txt', out.join('\n') + '\n');
          console.log(out.join('\n'));
          JS
      - name: Visu attēlu formāts (GET ar Accept webp, tikai galvenes)
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parseCsv } from './feed-core.mjs';
          const rows = parseCsv(readFileSync('custom-check/google-ads-custom-lv.csv', 'utf8')).slice(1);
          const out = [];
          const count = {};
          let next = 0;
          async function worker() {
            while (next < rows.length) {
              const r = rows[next++];
              const ext = (new URL(r[6]).pathname.match(/\.(\w+)$/) || [])[1]?.toLowerCase() || '?';
              let type = 'kļūda';
              let status = 0;
              for (let a = 0; a < 3 && !status; a++) {
                try {
                  const res = await fetch(r[6], { headers: { Accept: 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8' }, signal: AbortSignal.timeout(20000) });
                  status = res.status;
                  type = (res.headers.get('content-type') || '?').split(';')[0];
                  await res.body?.cancel();
                } catch (e) { type = `kļūda ${e.name}`; }
              }
              const k = `${ext} -> ${status} ${type}`;
              count[k] = (count[k] || 0) + 1;
              if (status !== 200 || !/^image\/(jpeg|png|gif)$/.test(type)) {
                // Izmēģinājums: vai format=png dod PNG arī klientiem, kas pieņem WebP (caurspīdīgs fons)
                let alt = '?';
                try {
                  const res2 = await fetch(r[6].replace('format=pjpg', 'format=png'), { headers: { Accept: 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8' }, signal: AbortSignal.timeout(20000) });
                  alt = `${res2.status} ${(res2.headers.get('content-type') || '?').split(';')[0]}`;
                  await res2.body?.cancel();
                } catch (e) { alt = `kļūda ${e.name}`; }
                count[`${k} | format=png -> ${alt}`] = (count[`${k} | format=png -> ${alt}`] || 0) + 1;
                out.push([r[0], ext, status, type, alt, r[6]].join(','));
              }
            }
          }
          await Promise.all(Array.from({ length: 12 }, worker));
          writeFileSync('custom-check/attelu-formati.csv', ['ID,paplašinājums,HTTP,content-type,format=png,attēls', ...out].join('\n') + '\n');
          writeFileSync('custom-check/attelu-formati.json', JSON.stringify(count, null, 2));
          console.log(JSON.stringify(count, null, 2));
          JS
      - name: Veikala dati lokālai pārbaudei (tikai šajā pagaidu darbplūsmā)
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          import { fromStorefront } from './generate.mjs';
          const products = await fromStorefront();
          writeFileSync('custom-check/products.json.gz', gzipSync(JSON.stringify(products)));
          console.log(`produkti ${products.length}`);
          JS
      - name: Rezultāts žurnālā (tar.gz, base64)
        run: tar czf - custom-check | base64 -w 60000 | sed 's/^/DRYRUN64 /'
