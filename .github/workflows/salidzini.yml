name: Salidzini XML

on:
  schedule:
    # Katras 2 stundas: UTC 4:17–18:17 = ziemā Rīgā 6:17, 8:17 … 20:17 (vasarā stundu vēlāk).
    # Bieži, jo GitHub plānotos darbus mēdz kavēt vai izlaist; tā fails pirms katras
    # Salidzini nolasīšanas (08–12, 12–13, 15–16, 18–19) ir svaigs. Minūte :17 – ne pilnā stundā.
    - cron: '17 4-18/2 * * *'
  workflow_dispatch: # ļauj palaist arī ar roku (Actions → Salidzini XML → Run workflow)

permissions:
  contents: write # nedēļas statusa ieraksts (lai GitHub neatslēgtu grafiku pēc 60 dienām bez aktivitātes)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Ģenerē XML
        env:
          SHOPIFY_STORE: sarlotesaudumi.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node generate.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Nedēļas statuss (pirmdienas rītā)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Europe/Riga date +%u)" = "1" ] && [ "$(TZ=Europe/Riga date +%H)" -lt 10 ]; then
            mkdir -p status && cp public/stats.json status/last-run.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/last-run.json
            git commit -m "Statuss $(TZ=Europe/Riga date +%F)" || echo "Nav izmaiņu"
            git push || echo "Statusu neizdevās ierakstīt – XML tas neietekmē"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
